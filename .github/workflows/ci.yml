# Checks every push and pull request (docs/08-testing-and-infra.md → «CI»).
# Playwright E2E joins with the first scenarios (T-20).
name: CI

# Task branches are checked through their pull request; a push to main checks the merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request makes the running check obsolete; runs on main are
# never cancelled, so every merge gets its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Install scripts of dependencies run later; they do not need the token.
          persist-credentials: false

      # Version from the packageManager field of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # prepare builds packages/shared; apps/api postinstall generates the Prisma client.
      - run: pnpm install --frozen-lockfile

      # Root lint and typecheck build shared and generate the web API types (pnpm gen:api)
      # first: schema.d.ts is not committed. A job that runs them per package must do the same.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Fails below 90 % coverage of the fishing rules and the CatchValidator (vitest.config.ts).
      - run: pnpm --filter @lowisko/shared test:coverage

      # Testcontainers starts PostgreSQL on the runner's Docker.
      - run: pnpm --filter api test:e2e

      - run: pnpm build
