packages:
  - apps/*
  - packages/*

# Single source of versions for tools used by more than one package.
catalog:
  typescript: 6.0.3
  vitest: 5.0.4

# Install scripts are denied: all three ship prebuilt binaries or only send telemetry.
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  unrs-resolver: false
