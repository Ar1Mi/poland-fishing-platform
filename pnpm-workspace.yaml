packages:
  - apps/*
  - packages/*

# Single source of versions for tools used by more than one package, and for those that must
# match another one's version.
catalog:
  typescript: 6.0.3
  vitest: 5.0.4
  # Coverage provider of vitest: its version follows vitest exactly (peer dependency).
  '@vitest/coverage-v8': 5.0.4
  # Node types of the API and of the Playwright code of web: the Node version of .nvmrc.
  '@types/node': 24.19.2

# Install scripts are denied unless a package cannot work without them:
# prebuilt binaries come as optional dependencies, the rest is telemetry,
# version notices or optional native speed-ups (ssh2, cpu-features).
# argon2 ships prebuilt binaries (node-gyp-build loads them); its script only compiles from source.
# @prisma/engines downloads the schema engine binary that `prisma migrate` runs.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: false
  cpu-features: false
  esbuild: false
  prisma: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
